<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Weapons</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
	<html play script>
<html runtime storage path "/storage/emulated/0/Android/data/com.dts.freefireth/files/contentcache/Compulsory/android/gameassetbundles/config/">
<html runtime package "com.dts.freefireth">
<html running app "Free Fire">
<script configuration game>
	 <script layer "configuration">
 <runtime "lag fix">
 <runtime internet speed "fast">
 <aimbot enemy>
         <aimbot enemy head "90">
 <aimfov enemy>
          <aimfov enemy head "360">
 <aimlock enemy>
          <aimlock enemy head "90">
 <easy drag enemy>
          <easy drag enemy head "90">
 <easy swap>
          <easy swap head "very fast">
 <fire button>
          <fire button size "any">
 <character run>
          <character run "fast">
 <mobile internet speed>
          <mobile internet speed "fast">
 <weapon fire>
          <weapon fire "fast">
 <character run increase>
          <character run increase "true">
 <increase movement>
          <increase movement speed "true">
 <pc sensitivities>
          <pc sensitivities "3500">
 <all working character>
          <all working character "true">
 <sensitivity iphone>
          <high sensitivity iphone "true">
 <android width dpi>
          <android width dpi "2000">
 <matchmaking problem>
          <matchmaking problem "false">
 <hacker problem>
          <hacker problem "false">
 <easy start game>
          <easy start game "true">
 <game start time>
          <games start time under "10 second">
 <easy aimlock head time>
          <easy aimlock head time "ultra fast">
 <easy aimbot head time>
          <easy aimbot head time "ultra fast">
 <easy swap screen time>
          <easy swap screen time "ultra fast">
 <script deactivate time>
          <script deactivate time "game close">
 <script active time>
          <script active time "game open">
 <working weapon>
          <weapon working "DisertEagle","M1887","Groza","Groza x","Famous","Famous x","Ump","Mp5","woodpecker","AC80","UMP","DIESEL","M1040","MP40","Usp",etc>
    <h1>Free Fire Weapons</h1>
    <ul id="weapon-list">
        <li>DisertEagle <button class="aim-btn" data-weapon="DisertEagle">Aim Head</button></li>
        <li>M1887 <button class="aim-btn" data-weapon="M1887">Aim Head</button></li>
        <li>Groza <button class="aim-btn" data-weapon="Groza">Aim Head</button></li>
        <li>Groza x <button class="aim-btn" data-weapon="Groza x">Aim Head</button></li>
        <li>Famous <button class="aim-btn" data-weapon="Famous">Aim Head</button></li>
        <li>Famous x <button class="aim-btn" data-weapon="Famous x">Aim Head</button></li>
        <li>Ump <button class="aim-btn" data-weapon="Ump">Aim Head</button></li>
        <li>Mp5 <button class="aim-btn" data-weapon="Mp5">Aim Head</button></li>
        <li>Woodpecker <button class="aim-btn" data-weapon="Woodpecker">Aim Head</button></li>
        <li>AC80 <button class="aim-btn" data-weapon="AC80">Aim Head</button></li>
        <li>UMP <button class="aim-btn" data-weapon="UMP">Aim Head</button></li>
        <li>DIESEL <button class="aim-btn" data-weapon="DIESEL">Aim Head</button></li>
        <li>M1040 <button class="aim-btn" data-weapon="M1040">Aim Head</button></li>
        <li>MP40 <button class="aim-btn" data-weapon="MP40">Aim Head</button></li>
        <li>Usp <button class="aim-btn" data-weapon="Usp">Aim Head</button></li>
    </ul>
    <p id="status">Choose a weapon to aim at the head.</p>

    <script src="script.js"></script>
</body>
</html>
